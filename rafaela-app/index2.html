<!DOCTYPE html>
<html class="light antialiased" data-style="default" data-accent-color="blue" lang="pt-BR" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
    <title>Meta AI - Artefato Compartilhado</title>
    <meta name="description" content="Visualização de artefato compartilhado do Meta AI.">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="https://www.meta.ai/favicon.ico?v=2" sizes="32x32 48x48">
    
    <!-- Estilos base e Tailwind CSS para renderização do layout sem dependências locais -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/css">
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="flex h-screen flex-col">
        <!-- Cabeçalho -->
        <header class="flex shrink-0 items-center justify-between gap-3 p-4 bg-white border-b border-gray-200">
            <div class="flex min-w-0 flex-1 items-center gap-3">
                <!-- Botão Fechar -->
                <a href="https://www.meta.ai/" class="shrink-0 no-underline">
                    <button aria-label="Fechar" class="inline-flex shrink-0 cursor-pointer items-center justify-center rounded-full transition-transform duration-150 ease-in-out select-none size-9 bg-gray-100 hover:bg-gray-200 text-gray-700">
                        <svg viewBox="0 0 32 32" fill="none" width="20" height="20">
                            <path d="M22.88 24.12a.877.877 0 0 0 1.239-1.239l-6.881-6.88 6.88-6.882a.876.876 0 0 0-1.238-1.238L16 14.761l-6.881-6.88A.876.876 0 0 0 7.88 9.119L14.761 16l-6.88 6.881a.877.877 0 0 0 1.238 1.238l6.88-6.88 6.881 6.88z" fill="currentColor"></path>
                        </svg>
                    </button>
                </a>
                
                <!-- Logo -->
                <a href="https://www.meta.ai/" class="shrink-0 no-underline">
                    <img src="https://www.meta.ai/favicon.ico?v=2" alt="Meta AI" class="h-6 w-6 object-contain">
                </a>
                
                <!-- Info do Documento -->
                <div class="flex min-w-0 flex-col">
                    <span class="text-sm font-medium text-gray-900 truncate">final_pwa_zap_normal.html</span>
                    <span class="text-xs text-gray-500 truncate">O conteúdo é gerado pelo usuário e não verificado.</span>
                </div>
            </div>

            <!-- Ações -->
            <div class="flex shrink-0 items-center gap-2">
                <!-- Compartilhar -->
                <button aria-label="Compartilhar" class="inline-flex shrink-0 cursor-pointer items-center justify-center rounded-full transition-transform duration-150 ease-in-out select-none size-9 bg-gray-100 hover:bg-gray-200 text-gray-700">
                    <svg viewBox="0 0 32 32" fill="none" width="20" height="20">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M24.692 4.965c.331-.091.768-.179 1.202-.031.551.187.985.62 1.172 1.172.148.434.06.87-.031 1.202-.097.351-.262.789-.452 1.296L20.34 25.25c-.228.61-.42 1.123-.6 1.5-.162.34-.41.79-.858 1.024a1.875 1.875 0 0 1-1.544.087l-.21-.095-.158-.1c-.346-.25-.55-.633-.688-.933-.176-.379-.362-.894-.585-1.506l-1.754-4.824c-.297-.818-.399-1.075-.544-1.282a2.126 2.126 0 0 0-.521-.521c-.208-.145-.465-.247-1.283-.544l-4.823-1.754c-.612-.223-1.127-.409-1.507-.585-.342-.16-.793-.401-1.032-.847a1.876 1.876 0 0 1-.103-1.544l.094-.21c.235-.448.684-.695 1.025-.857.377-.18.89-.372 1.5-.6l16.647-6.243c.507-.19.945-.355 1.296-.452zM15.26 17.961c-.105.109-.212.217-.318.325.245.405.413.88.646 1.52l1.753 4.823c.235.645.391 1.074.528 1.368.06.129.103.2.127.236a.119.119 0 0 0 .034 0c.024-.035.069-.106.13-.235.14-.293.301-.72.542-1.362l6.21-16.563-9.652 9.888zm-7.896-4.663c-.642.24-1.07.402-1.362.542-.13.061-.201.105-.237.129a.12.12 0 0 0 0 .034c.036.023.108.068.238.128.294.137.723.293 1.368.527l4.823 1.754c.638.232 1.114.4 1.518.645l.327-.318c3.295-3.216 6.589-6.434 9.883-9.651l-16.558 6.21z" fill="currentColor"></path>
                    </svg>
                </button>
                
                <!-- Mais Opções -->
                <button aria-label="Mais" class="inline-flex shrink-0 cursor-pointer items-center justify-center rounded-full transition-transform duration-150 ease-in-out select-none size-9 bg-gray-100 hover:bg-gray-200 text-gray-700">
                    <svg viewBox="0 0 32 32" fill="none" width="20" height="20">
                        <path d="M8 14.125a1.875 1.875 0 1 1 0 3.75 1.875 1.875 0 0 1 0-3.75zm8 0a1.875 1.875 0 1 1 0 3.75 1.875 1.875 0 0 1 0-3.75zm8 0a1.875 1.875 0 1 1 0 3.75 1.875 1.875 0 0 1 0-3.75z" fill="currentColor"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Áreas do Conteúdo (Iframe) -->
        <main class="relative min-h-0 flex-1 bg-gray-100">
            <iframe 
                allow="autoplay; fullscreen" 
                sandbox="allow-scripts allow-forms allow-same-origin allow-downloads" 
                class="h-full w-full border-0 rounded-t-xl bg-white" 
                title="Artefato compartilhado" 
                src="about:blank">
            </iframe>
        </main>
    </div>
</body>
</html>
